name: Validate AI Titan Tycoon
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/ai-lifecycle-market-audit]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
